# ================= GLMBOT CONFIG v1.4 =================
# Copy to config.yml and edit. NEVER commit real keys (config.yml is gitignored).
#
# Quick start:
#   1. cp config.example.yml config.yml
#   2. paste api.key / api.secret (or export GLMBOT_API_KEY / GLMBOT_API_SECRET)
#   3. py bot.py validate && py bot.py doctor
#
# Env interpolation: any value may use ${VAR} or ${VAR:-default}.
# Example:  key: "${GLMBOT_API_KEY:-YOUR_BINANCE_API_KEY}"

api:
  key: "${GLMBOT_API_KEY:-YOUR_BINANCE_API_KEY}"
  secret: "${GLMBOT_API_SECRET:-YOUR_BINANCE_API_SECRET}"
  # true = Binance Testnet (spot testnet OR futures testnet, per trade_type).
  # false = MAINNET (real money — triple-check mode + trade_type first).
  testnet: true

trading:
  quote_asset: "USDT"          # all pairs trade vs this quote (symbols must end with it)
  mode: "paper"                # paper | live  (paper = simulated fills, no keys needed)
  trade_type: "spot"           # spot | futures (futures = USD-M, long-only, one-way mode)
  leverage: 1                  # futures only: 1..20. Start at 1-2! (spot must be 1)
  update_interval_sec: 60      # main loop interval, >= 5 (60 = one check per 15m candle slice)
  # Exchange-native safety net (live futures only): attach STOP_MARKET +
  # TAKE_PROFIT_MARKET (closePosition) on every entry. They fire on Binance
  # even while the bot is down. Bot-side trailing/signal exits act first.
  exchange_stops: true

strategies:
  # Available: ema_cross, rsi_reversion, macd, bollinger, supertrend,
  #   donchian_breakout, vwap_trend, stoch_rsi_cross, bollinger_squeeze,
  #   trend_momentum. Run `py bot.py strategies` for signal logic + parameters.
  # NOTE: changing `active` changes vote math (risk.min_votes) - backtest first.
  active: ["ema_cross", "rsi_reversion", "macd", "bollinger"]
  ema_cross:
    fast: 9
    slow: 21                   # must be > fast
  rsi_reversion:
    period: 14
    oversold: 30               # BUY when RSI recovers above this
    overbought: 70             # SELL when RSI drops below this
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    period: 20
    std_dev: 2.0
  # supertrend:
  #   period: 10
  #   multiplier: 3.0
  # donchian_breakout:
  #   period: 20
  # vwap_trend:                # close vs rolling VWAP cross
  #   period: 20
  # stoch_rsi_cross:           # momentum ignition (0..1 scale)
  #   rsi_period: 14
  #   stoch_period: 14
  #   oversold: 0.2
  #   overbought: 0.8
  # bollinger_squeeze:         # volatility breakout after pinch
  #   period: 20
  #   std_dev: 2.0
  #   lookback: 50
  # trend_momentum:            # EMA-stack regime + RSI 50-cross
  #   fast: 20
  #   slow: 50
  #   rsi_period: 14

risk:
  quote_budget: 1000.0         # total quote allocated to the bot (sizing anchor)
  per_trade_pct: 2.0           # % of budget as margin/notional per position
  max_open_positions: 3        # portfolio cap (1 per symbol in v1)
  stop_loss_pct: 2.0           # fixed stop below entry. Futures: price move (x leverage on margin!)
  take_profit_pct: 4.0         # fixed target above entry
  trailing_stop_pct: 1.5       # ratchet distance (0 = disabled)
  cooldown_min: 30             # min minutes between entries per symbol
  # --- breakeven stop: once up X%, lock SL to entry + buffer (0 = disabled) ---
  breakeven_trigger_pct: 2.0
  breakeven_buffer_pct: 0.1
  # --- time stop: exit stale positions after N minutes (0 = disabled) ---
  max_hold_min: 0              # e.g. 1440 = flat-exit after 24h without TP
  # --- kill-switch trio: daily cap + consecutive losses + peak drawdown ---
  consecutive_loss_halt: 3     # halt day after N straight losing closes (0 = off)
  max_drawdown_halt_pct: 10.0  # halt day after N% drawdown vs peak equity (0 = off)
  # --- constant-risk sizing: risk N% of equity per trade (SL-distance based),
  #     capped by per_trade_pct budget (0 = legacy budget sizing) ---
  risk_per_trade_pct: 1.0
  # --- ATR stops (volatility-adaptive; override fixed % when enabled) ---
  atr_stops: false
  atr_period: 14
  atr_sl_mult: 2.0             # SL = entry - 2*ATR
  atr_tp_mult: 3.0             # TP = entry + 3*ATR
  # --- daily kill switch (0 = disabled; 5 = halt new entries after -5% day) ---
  daily_loss_cap_pct: 5.0
  # --- consensus voting: 0 = ALL strategies must agree; N = at least N of M (SELL vetoes) ---
  min_votes: 0
  # --- opt-in guards (0 = disabled) ---
  max_daily_trades: 0          # cap BUY fills per UTC day
  max_symbol_positions: 1      # reserved (v1 = 1 position per symbol)
  slippage_bps: 0.0            # backtest slippage in basis points (e.g. 5 = 0.05%)
  stop_slippage_bps: 0.0       # extra adverse slippage on stop fills (fast markets)

watchlist:
  symbols: ["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT"]

storage:
  sqlite_path: "data/glm.db"  # single-file journal (copy phone<->PC to migrate)
  klines_cache_dir: "data/cache"

notifier:
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN:-}"
    chat_id: "${TELEGRAM_CHAT_ID:-}"
  webhook:
    enabled: false
    url: "${GLMBOT_WEBHOOK_URL:-}"   # POSTs JSON {event, text, ts}
